<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1d6"/>
      <stop offset="45%" stop-color="#cfa859"/>
      <stop offset="75%" stop-color="#b88f3c"/>
      <stop offset="100%" stop-color="#8a6723"/>
    </linearGradient>
    <linearGradient id="burgundyGradL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a1c33"/>
      <stop offset="50%" stop-color="#6b1426"/>
      <stop offset="100%" stop-color="#4a0b17"/>
    </linearGradient>
  </defs>

  <!-- Left Monogram Icon -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="48" fill="url(#burgundyGradL2)" stroke="url(#goldGradL2)" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="43" fill="none" stroke="url(#goldGradL2)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="24" y="60" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="900" fill="url(#goldGradL2)">W</text>
    <circle cx="50" cy="50" r="10" fill="none" stroke="url(#goldGradL2)" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="5" fill="url(#goldGradL2)"/>
    <text x="76" y="60" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="900" fill="url(#goldGradL2)" text-anchor="end">W</text>
  </g>

  <!-- Brand Typography -->
  <text x="125" y="55" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="900" fill="#6b1426" letter-spacing="2">
    WoW <tspan fill="#cfa859">STUDIO</tspan>
  </text>
  <text x="128" y="80" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#8a6723">
    PREMIUM PHOTOGRAPHY &amp; CINEMATIC FILMS
  </text>
</svg>
